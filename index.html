<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>네이버 블로그 쿠팡파트너스 수집기</title>
<style>
  :root {
    --bg:       #0f0f13;
    --surface:  #1a1a24;
    --border:   #2a2a3a;
    --accent:   #6c63ff;
    --accent2:  #ff6584;
    --green:    #4ade80;
    --yellow:   #facc15;
    --text:     #e2e2f0;
    --muted:    #7070a0;
    --radius:   12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  /* ── 헤더 ── */
  header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    border-bottom: 1px solid var(--border);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 20px; font-weight: 700; }
  header .badge {
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 600;
  }

  /* ── 레이아웃 ── */
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }
  .grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }

  /* ── 카드 ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }
  .card h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 16px; }

  /* ── 폼 요소 ── */
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; margin-top: 14px; }
  label:first-of-type { margin-top: 0; }
  input[type="text"], input[type="number"], input[type="password"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 12px;
    font-size: 13px;
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: var(--accent); }

  .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* ── 버튼 ── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: opacity .15s, transform .1s;
    width: 100%;
    justify-content: center;
    margin-top: 18px;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-danger  { background: #ef4444; color: #fff; }
  .btn-dl      { background: #059669; color: #fff; margin-top: 12px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* ── 오른쪽 패널 ── */
  .right-panel { display: flex; flex-direction: column; gap: 20px; }

  /* ── 진행 로그 ── */
  #log-box {
    background: #0a0a10;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    height: 220px;
    overflow-y: auto;
    font-family: 'Consolas', monospace;
    font-size: 12px;
    line-height: 1.7;
    color: #a0a0c0;
  }
  #log-box .ok   { color: var(--green); }
  #log-box .warn { color: var(--yellow); }
  #log-box .err  { color: var(--accent2); }

  /* ── 상태 배지 ── */
  #status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    background: var(--border);
    color: var(--muted);
    margin-bottom: 10px;
  }
  #status-badge.running { background: #1a3a1a; color: var(--green); }
  #status-badge.done    { background: #1a1a3a; color: var(--accent); }
  #status-badge.error   { background: #3a1a1a; color: var(--accent2); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .dot.pulse { animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* ── TOP 10 카드 ── */
  #top10 { display: flex; flex-direction: column; gap: 12px; }
  .post-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    display: grid;
    grid-template-columns: 42px 1fr;
    gap: 12px;
    transition: border-color .2s;
  }
  .post-card:hover { border-color: var(--accent); }
  .rank-badge {
    width: 42px; height: 42px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 800; color: #fff;
    flex-shrink: 0;
  }
  .rank-badge.gold   { background: linear-gradient(135deg,#f59e0b,#d97706); }
  .rank-badge.silver { background: linear-gradient(135deg,#9ca3af,#6b7280); }
  .rank-badge.bronze { background: linear-gradient(135deg,#b45309,#92400e); }

  .post-info h3 { font-size: 14px; font-weight: 700; margin-bottom: 5px; }
  .post-meta {
    display: flex; flex-wrap: wrap; gap: 8px;
    font-size: 11px; color: var(--muted); margin-bottom: 8px;
  }
  .post-meta span { display: flex; align-items: center; gap: 3px; }
  .post-links a {
    display: inline-block;
    background: #0f1a0f;
    color: var(--green);
    border: 1px solid #1a3a1a;
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 11px;
    text-decoration: none;
    margin-right: 6px;
    margin-bottom: 4px;
  }
  .post-links a:hover { background: #1a3a1a; }
  .post-preview {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.6;
    max-height: 60px;
    overflow: hidden;
    white-space: pre-wrap;
  }
  .expand-btn {
    font-size: 11px;
    color: var(--accent);
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    margin-top: 4px;
  }
  .threads-link {
    font-size: 11px;
    color: var(--muted);
    text-decoration: none;
    margin-top: 6px;
    display: inline-block;
  }
  .threads-link:hover { color: var(--text); }

  /* ── 전체 테이블 ── */
  #all-table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  th {
    background: #12121c;
    color: var(--muted);
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    position: sticky;
    top: 0;
  }
  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    max-width: 280px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    vertical-align: middle;
  }
  tr:hover td { background: #14141e; }
  td a { color: var(--accent); text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .tbl-score { color: var(--yellow); font-weight: 700; }

  /* ── 빈 상태 ── */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty .emoji { font-size: 40px; margin-bottom: 12px; }
  .empty p { font-size: 14px; }

  /* ── 탭 ── */
  .tabs { display: flex; gap: 0; margin-bottom: 16px; }
  .tab {
    padding: 9px 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--muted);
    transition: all .15s;
  }
  .tab:first-child { border-radius: 8px 0 0 8px; }
  .tab:last-child  { border-radius: 0 8px 8px 0; border-left: none; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  @media(max-width:768px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>📝 네이버 블로그 쿠팡파트너스 수집기</h1>
  </div>
  <span class="badge">로그인 불필요</span>
</header>

<div class="container">
  <div class="grid">

    <!-- ── 왼쪽: 설정 패널 ── -->
    <div>
      <div class="card">
        <h2>⚙️ 수집 설정</h2>

        <label>검색 키워드 (쉼표 구분)</label>
        <input type="text" id="tags" value="쿠팡파트너스,쿠팡추천,쿠팡구매" />
        <p class="hint">네이버 블로그 검색어로 사용됩니다</p>

        <label>수집 범위 (시간)</label>
        <input type="number" id="hours" value="48" min="1" max="720" />

        <label>키워드당 최대 페이지 수</label>
        <input type="number" id="scrolls" value="3" min="1" max="50" />
        <p class="hint">1페이지 = 블로그 글 10개 (많을수록 느림)</p>

        <div style="margin-top:16px;padding:10px 12px;border-radius:8px;font-size:12px;background:#0a1a0a;border:1px solid #1a3a1a;color:#4ade80;">
          ✅ 로그인 없이 바로 수집됩니다
        </div>

        <button class="btn btn-primary" id="start-btn" onclick="startJob()">▶ 수집 시작</button>
        <button class="btn btn-danger"  id="stop-btn"  onclick="stopJob()" style="display:none">⏹ 중단</button>
        <button class="btn btn-dl"      id="dl-btn"    onclick="downloadCSV()" style="display:none">⬇ CSV 다운로드</button>
      </div>
    </div>

    <!-- ── 오른쪽: 결과 ── -->
    <div class="right-panel">

      <!-- 진행 상황 -->
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <h2 style="margin:0">📡 진행 상황</h2>
          <span id="status-badge"><span class="dot"></span> 대기 중</span>
        </div>
        <div id="log-box"><span class="warn">▶ 수집 시작을 눌러주세요.</span></div>
      </div>

      <!-- 탭: TOP10 / 전체 -->
      <div>
        <div class="tabs">
          <div class="tab active" onclick="switchTab('top10-tab', this)">🏆 TOP 10</div>
          <div class="tab"        onclick="switchTab('all-tab',   this)">📋 전체 목록 (벤치마킹)</div>
        </div>

        <div id="top10-tab" class="tab-content active">
          <div id="top10">
            <div class="empty">
              <div class="emoji">🔎</div>
              <p>수집이 완료되면 TOP 10이 표시됩니다.</p>
            </div>
          </div>
        </div>

        <div id="all-tab" class="tab-content">
          <div id="all-table-wrap">
            <div class="empty">
              <div class="emoji">📄</div>
              <p>수집이 완료되면 전체 게시글이 표시됩니다.</p>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
let pollTimer = null;
let lastLogCount = 0;

// ── 탭 전환 ──────────────────────────────────────────────────────────────────
function switchTab(id, el) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
}

// ── 수집 시작 ─────────────────────────────────────────────────────────────────
async function startJob() {
  const tags    = document.getElementById('tags').value.split(',').map(s => s.trim()).filter(Boolean);
  const hours   = parseInt(document.getElementById('hours').value) || 48;
  const scrolls = parseInt(document.getElementById('scrolls').value) || 10;

  lastLogCount = 0;
  document.getElementById('log-box').innerHTML = '';
  document.getElementById('top10').innerHTML = '<div class="empty"><div class="emoji">⏳</div><p>수집 중...</p></div>';
  document.getElementById('all-table-wrap').innerHTML = '<div class="empty"><div class="emoji">⏳</div><p>수집 중...</p></div>';
  document.getElementById('dl-btn').style.display = 'none';

  setStatus('running', '수집 중...');
  toggleBtns(true);

  await fetch('/api/start', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ tags, hours, max_scrolls: scrolls }),
  });

  pollTimer = setInterval(pollStatus, 1500);
}

// ── 중단 ──────────────────────────────────────────────────────────────────────
async function stopJob() {
  await fetch('/api/stop', { method: 'POST' });
  clearInterval(pollTimer);
  setStatus('done', '중단됨');
  toggleBtns(false);
}

// ── 상태 폴링 ─────────────────────────────────────────────────────────────────
async function pollStatus() {
  try {
    const res  = await fetch('/api/status');
    const data = await res.json();

    // 새 로그만 추가
    const logBox = document.getElementById('log-box');
    const newLogs = data.logs.slice(lastLogCount);
    newLogs.forEach(msg => {
      const span = document.createElement('div');
      span.className = msg.startsWith('✓') || msg.startsWith('✅') || msg.startsWith('🏁') || msg.startsWith('🏆') ? 'ok'
                     : msg.startsWith('❌') ? 'err'
                     : msg.startsWith('⚠️') || msg.startsWith('⏰') ? 'warn' : '';
      span.textContent = msg;
      logBox.appendChild(span);
    });
    lastLogCount = data.logs.length;
    logBox.scrollTop = logBox.scrollHeight;

    if (data.done) {
      clearInterval(pollTimer);
      toggleBtns(false);

      if (data.error) {
        setStatus('error', '오류 발생');
      } else {
        setStatus('done', `완료 — ${data.results.length}개 수집`);
        renderResults(data.results);
        if (data.results.length > 0) {
          document.getElementById('dl-btn').style.display = '';
        }
      }
    }
  } catch(e) {
    console.error(e);
  }
}

// ── 결과 렌더링 (TOP 10) ──────────────────────────────────────────────────────
function renderResults(posts) {
  // TOP 10
  const top10El = document.getElementById('top10');
  if (!posts.length) {
    top10El.innerHTML = '<div class="empty"><div class="emoji">😅</div><p>쿠팡파트너스 게시글을 찾지 못했습니다.<br>태그를 추가하거나 스크롤 수를 늘려보세요.</p></div>';
    return;
  }

  top10El.innerHTML = '';
  posts.slice(0, 10).forEach((p, i) => {
    const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    const dt = p.created_at ? new Date(p.created_at).toLocaleString('ko-KR') : '시간 미상';
    const linksHtml = (p.coupang_links || []).slice(0, 3).map(url =>
      `<a href="${esc(url)}" target="_blank" rel="noopener">🛒 쿠팡 링크</a>`
    ).join('');
    const preview = p.content || p.description || '';

    const card = document.createElement('div');
    card.className = 'post-card';
    card.innerHTML = `
      <div class="rank-badge ${rankClass}">${i+1}</div>
      <div class="post-info">
        <h3>${esc(p.product_name || p.title || '제품명 미상')}</h3>
        <div class="post-meta">
          <span>📝 ${esc(p.blog_name || '-')}</span>
          <span>🕐 ${dt}</span>
          <span>👁 ${num(p.views)}</span>
          <span>💬 ${num(p.comments)}</span>
          <span style="color:var(--yellow)">⭐ ${num(p.score)}</span>
        </div>
        <div class="post-links">${linksHtml}</div>
        <div class="post-preview" id="prev-${i}">${esc(preview.slice(0, 150))}</div>
        <button class="expand-btn" onclick="togglePreview(${i}, ${JSON.stringify(preview).replace(/</g,'\\u003c')})">더 보기 ▼</button>
        ${p.url ? `<a class="threads-link" href="${esc(p.url)}" target="_blank" rel="noopener">🔗 블로그 글 보기</a>` : ''}
      </div>
    `;
    top10El.appendChild(card);
  });

  // 전체 테이블
  const wrap = document.getElementById('all-table-wrap');
  const rows = posts.map((p, i) => {
    const dt = p.created_at ? new Date(p.created_at).toLocaleString('ko-KR') : '-';
    const links = (p.coupang_links || []).slice(0,2).map(url =>
      `<a href="${esc(url)}" target="_blank">링크</a>`
    ).join(' ');
    const preview = p.content || p.description || '';
    return `
      <tr>
        <td>${i+1}</td>
        <td>${esc(p.product_name || '-')}</td>
        <td>${esc(p.blog_name || '-')}</td>
        <td>${dt}</td>
        <td>${num(p.views)}</td>
        <td>${num(p.comments)}</td>
        <td class="tbl-score">${num(p.score)}</td>
        <td>${links}</td>
        <td>${p.url ? `<a href="${esc(p.url)}" target="_blank">글 보기</a>` : '-'}</td>
        <td title="${esc(preview)}">${esc(preview.slice(0,60))}…</td>
      </tr>
    `;
  }).join('');

  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>#</th><th>제품명</th><th>블로그</th><th>시각</th>
          <th>조회</th><th>댓글</th><th>점수</th>
          <th>쿠팡</th><th>글</th><th>내용</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

// ── 더 보기 토글 ──────────────────────────────────────────────────────────────
function togglePreview(i, fullText) {
  const el  = document.getElementById(`prev-${i}`);
  const btn = el.nextElementSibling;
  if (el.dataset.expanded === '1') {
    el.textContent = fullText.slice(0, 150);
    el.dataset.expanded = '';
    btn.textContent = '더 보기 ▼';
  } else {
    el.textContent = fullText;
    el.dataset.expanded = '1';
    btn.textContent = '접기 ▲';
  }
}

// ── CSV 다운로드 ───────────────────────────────────────────────────────────────
function downloadCSV() {
  window.location.href = '/api/download';
}

// ── 상태 배지 ─────────────────────────────────────────────────────────────────
function setStatus(type, text) {
  const el = document.getElementById('status-badge');
  el.className = 'status-badge ' + type;
  el.innerHTML = `<span class="dot${type === 'running' ? ' pulse' : ''}"></span> ${text}`;
}

function toggleBtns(running) {
  document.getElementById('start-btn').style.display = running ? 'none' : '';
  document.getElementById('stop-btn').style.display  = running ? ''     : 'none';
}

// ── 유틸 ──────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function num(n) {
  return Number(n).toLocaleString('ko-KR');
}
</script>
</body>
</html>
